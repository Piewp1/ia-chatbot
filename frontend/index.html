<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot IA Local</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <button id="new" type="button">+ Nueva conversación</button>
    <ul id="chats"></ul>
  </aside>
  <div class="chat">
    <header>
      <button id="toggle" type="button" title="Conversaciones">☰</button>
      <h1>Chatbot IA Local</h1>
      <span id="status" class="status">conectando…</span>
    </header>
    <main id="messages" aria-live="polite"></main>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" required></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
